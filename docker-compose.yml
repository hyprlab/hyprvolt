# The project name, fixed so the container and its volume keep their names
# whatever the folder is called.
name: hyprvolt

services:
  hyprvolt:
    # latest follows every release; a version (1.1.0) pins one.
    image: hyprlab/hyprvolt:${IMAGE_TAG:-latest}
    container_name: hyprvolt
    ports:
      # host:container. Change the left side if 8101 is taken on your host.
      - "8101:8000"
    environment:
      # What the app calls itself.
      - APP_NAME=${APP_NAME:-Hyprvolt}
      - APP_TAGLINE=${APP_TAGLINE:-IT documentation for on-premise infrastructure.}
      # Session signing key. If unset, one is generated and kept in the volume.
      - SECRET_KEY=${SECRET_KEY:-}
      # The secrets vault's key. If unset, one is made in the volume; keep a
      # copy of it elsewhere either way: losing it loses the secrets.
      - SECRETS_KEY=${SECRETS_KEY:-}
      # Where Settings > Backups keeps backups; /data/backups (the data
      # volume) unless set. Mount another disk and point this at it.
      - BACKUP_DIR=${BACKUP_DIR:-}
      # Set to 1 when the app is served over HTTPS.
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-0}
      # How many reverse proxies sit in front (Cloudflare Tunnel, Caddy...).
      - TRUST_PROXY=${TRUST_PROXY:-0}
      # Cloudflare Turnstile. Usually set up in Settings > Security instead.
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      # Fresh-install defaults. After setup, Settings > Admin wins.
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-0}
      - WORKER_MINUTES=${WORKER_MINUTES:-15}
      - ITEMS_PER_PAGE=${ITEMS_PER_PAGE:-40}
      # The time zone times are typed and shown in, such as America/Chicago.
      - TZ=${TZ:-UTC}
    volumes:
      - hyprvolt-data:/data
    restart: unless-stopped

volumes:
  hyprvolt-data:
