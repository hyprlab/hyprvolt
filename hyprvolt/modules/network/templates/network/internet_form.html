{# The Internet connection section in the form of a modem, router or
   firewall: the line that comes in at it, kept as the connection's link. #}
<div class="form-grid">
  <label class="field">
    <span class="field-label">Internet connection</span>
    <select name="s.internet.line">
      <option value="">None</option>
      {% for id, name in lines %}<option value="{{ id }}" {{ 'selected' if id == line_id }}>{{ name }}</option>{% endfor %}
    </select>
    <span class="hint">{% if lines %}The line from the ISP that plugs into it. Leave it at None for a device further in.{% else %}No internet connections recorded yet.{% endif %}</span>
  </label>
</div>
