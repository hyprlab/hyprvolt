{# The IP addresses section in the form of anything addressable. #}
<div class="form-grid">
  <label class="field form-wide">
    <span class="field-label">IP addresses</span>
    <input name="s.addresses.list" value="{{ current }}" spellcheck="false" autocomplete="off" placeholder="10.0.20.11, fd00::11">
    <span class="hint">Separated by commas. Each is an IP address record, found in its subnet; one taken off the list is deleted.</span>
  </label>
</div>
