{# The site setup guide (core/guide.py): its steps down the side under
   their groups; first what the guide covers (where a new install starts),
   then one step's rows, each a record to make, and at the end what the
   site has.
   Rows are fields named r<n>|<form name>; Add another copies the row in
   the <template> ([data-repeat] in app.js). #}
{% macro choice_options(choices, v) %}
  {%- for c in choices %}
    {%- if c is mapping %}<optgroup label="{{ c.label }}">{{ choice_options(c.options, v) }}</optgroup>
    {%- else %}<option value="{{ c[0] }}" {{ 'selected' if c[0]|string == v|string }}>{{ c[1] }}</option>{% endif %}
  {%- endfor %}
{%- endmacro %}
{% macro row_html(n, row) %}
<fieldset class="guide-row" data-repeat-row>
  <legend class="visually-hidden">{{ step.title }}, row {{ n + 1 if n is number else '' }}</legend>
  {% for c in cols %}
  {% set v = row.get(c.name, c.default if c.default is not none else '') %}
  {% if c.kind == 'check' %}
  <label class="check guide-check"><input type="checkbox" name="r{{ n }}|{{ c.name }}" value="1" {{ 'checked' if v }}><span>{{ c.label }}</span></label>
  {% else %}
  <label class="field {{ 'guide-wide' if c.name == 'name' }}"><span class="field-label">{{ c.label }}</span>
    {% if c.kind == 'select' %}
    <select name="r{{ n }}|{{ c.name }}">
      {% if not c.required %}<option value="">Not set</option>{% endif %}
      {{ choice_options(c.choices, v) }}
    </select>
    {% else %}
    <input type="{{ 'number' if c.kind == 'number' else 'text' }}" name="r{{ n }}|{{ c.name }}" value="{{ v }}"
           {%- if c.placeholder %} placeholder="{{ c.placeholder }}"{% endif %}{% if c.kind == 'number' %} step="any"{% endif %}
           autocomplete="off" spellcheck="false" maxlength="500">
    {% endif %}
  </label>
  {% endif %}
  {% endfor %}
  {% if not step.scope %}
  <button type="button" class="iconbtn iconbtn--sm guide-remove" data-repeat-remove aria-label="Remove this row" title="Remove this row">
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  {% endif %}
</fieldset>
{% endmacro %}

<div class="guide">
  <nav class="guide-rail" aria-label="Steps">
    <a href="{{ url_for('guide.start', site=scope.id if scope else none) }}" class="guide-step{{ ' is-active' if intro }}"
       {%- if intro %} aria-current="step"{% endif %}>
      <span class="guide-num"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span><span>Overview</span></a>
    {% for g in groups %}
    {% if g.label %}<p class="guide-group">{{ g.label }}</p>{% endif %}
    <ol class="guide-steps" start="{{ g.steps[0][0] + 1 }}">
      {% for n, s in g.steps %}
      {% set here = not done and not intro and s.key == step.key %}
      <li><a href="{{ url(s.key, scope) }}" class="guide-step{{ ' is-active' if here }}{{ ' is-past' if done or (not intro and n < index) }}"
             {%- if here %} aria-current="step"{% endif %}><span class="guide-num">{{ n + 1 }}</span><span>{{ s.title }}</span></a></li>
      {% endfor %}
    </ol>
    {% endfor %}
    <a href="{{ url('done', scope) }}" class="guide-step guide-step--end{{ ' is-active' if done }}"{% if done %} aria-current="step"{% endif %}>
      <span class="guide-num"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span><span>Done</span></a>
  </nav>

  <div class="guide-main">
  {% if intro %}
    <p class="guide-count">{{ 'Welcome' if fresh else 'Overview' }}</p>
    <h2 class="guide-title">{% if fresh %}Let's document your first site{% else %}Set up a site, step by step{% endif %}</h2>
    <p class="guide-intro">This guide covers the {{ groups|length }} main categories of a site, shown below, each with
      its own set of subcategories. These records can then be linked to form relationships as part of the
      documentation system.</p>
    <ol class="guide-plan">
      {% for g in groups %}
      <li>
        <span class="guide-plan-head">{{ g.label or 'Steps' }}</span>
        <span class="guide-plan-steps">{{ g.plan }}</span>
      </li>
      {% endfor %}
    </ol>
    <p class="guide-intro">Add as many rows as you like at each step. A step that doesn't apply can be skipped, and the
      guide can be run again at any time from the New + menu.</p>
    <div class="guide-nav">
      <div class="guide-nav-side">
        <a class="btn btn--ghost" href="{{ url_for('main.index') }}">{{ 'Not now' if fresh else 'Back to the dashboard' }}</a>
        {% if seed %}<button type="button" class="btn btn--ghost" data-api-post="/admin/seed-demo" data-then="go" data-go="{{ url_for('main.index') }}"
                data-done="The demo homelab is loaded">Load a demo homelab instead</button>{% endif %}
      </div>
      <div class="guide-nav-side guide-nav-go">
        <a class="btn btn--primary" href="{{ url(steps[0].key, scope) }}">{{ 'Start with the site' if fresh else 'Start' }}</a>
      </div>
    </div>
  {% elif done %}
    <p class="guide-count">Done{% if scope %} · {{ scope.name }}{% endif %}</p>
    <h2 class="guide-title">{{ scope.name if scope else 'The site' }} is written down</h2>
    <p class="guide-intro">Each record has more to fill in when you are ready: open it from the dashboard or the sidebar.
      A step can be run again at any time to add what was left out.</p>
    {% for x in finishes %}
    <form class="guide-next" method="post" action="{{ url_for('guide.finish', key=x.finish.key, site=scope.id) }}">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <div class="guide-next-text">
        <span class="guide-next-title">{{ 'Your runbook' if x.made else 'Next, write it down' }}</span>
        <span class="hint">{{ x.finish.text }}</span>
      </div>
      <button class="btn btn--primary">{{ x.finish.open_label if x.made and x.finish.open_label else x.finish.label }}</button>
    </form>
    {% endfor %}
    <ul class="manage-list">
      {% for s in summary %}
      <li class="manage-item">
        <div class="manage-meta">
          <span class="manage-title">{{ s.step.title }}</span>
          <span class="manage-sub">{{ 'Nothing yet' if not s.count else (s.count ~ ' recorded') }}</span>
        </div>
        <a class="btn btn--xs btn--ghost" href="{{ url(s.step.key, scope) }}">{{ 'Add some' if not s.count else 'Add more' }}</a>
      </li>
      {% endfor %}
    </ul>
    <div class="guide-nav">
      <div class="guide-nav-side">
        <a class="btn btn--ghost" href="{{ url_for('guide.start') }}">Set up another site</a>
      </div>
      <div class="guide-nav-side guide-nav-go">
        <a class="btn {{ 'btn--ghost' if finishes else 'btn--primary' }}" href="{{ url_for('main.index') }}">Open the dashboard</a>
        {% if diagram %}<a class="btn btn--ghost" href="{{ url_for('main.module_page', module_id='diagram', key='network') }}">See the network diagram</a>{% endif %}
      </div>
    </div>
  {% else %}
    <p class="guide-count">Step {{ index + 1 }} of {{ steps|length }}{% if step.group %} · {{ step.group }}{% endif %}{% if scope and not step.scope %} · {{ scope.name }}{% endif %}</p>
    <h2 class="guide-title">{{ step.title }}</h2>
    <p class="guide-intro">{{ step.intro }}</p>
    {% if step.tree %}
    {% if tree_html %}{{ tree_html }}{% else %}
    <p class="hint">These go in a site: choose or add the site in step 1 first.</p>{% endif %}
    <div class="guide-nav">
      <div class="guide-nav-side">
        <a class="btn btn--ghost" href="{{ url(back, scope) if back else url_for('guide.start', site=scope.id if scope else none) }}">Back</a>
      </div>
      <div class="guide-nav-side guide-nav-go">
        <a class="btn btn--primary" href="{{ url(following, scope) }}">Continue</a>
      </div>
    </div>
    <p class="hint">Each change is saved as you make it.</p>
    {% else %}
    {% if added %}<p class="guide-added" role="status">{{ added }} added. Add more, or continue.</p>{% endif %}
    {% if existing %}
    <div class="guide-existing">
      <span class="setting-label">Already recorded</span>
      <ul class="guide-chips">
        {% for e in existing[:30] %}
        <li>{{ e if e is string else e.name }}</li>
        {% endfor %}
        {% if existing|length > 30 %}<li class="hint">and {{ existing|length - 30 }} more</li>{% endif %}
      </ul>
    </div>
    {% endif %}

    <form method="post" action="{{ url(step.key, scope) }}" class="guide-form">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      {% if step.scope and choices %}
      <label class="field guide-pick"><span class="field-label">Continue with one already recorded</span>
        <select name="existing">
          <option value="">No, a new one below</option>
          {% for id, name in choices %}<option value="{{ id }}" {{ 'selected' if scope and scope.id == id }}>{{ name }}</option>{% endfor %}
        </select></label>
      {% endif %}
      <div class="guide-rows" data-repeat>
        {% for row in rows %}{{ row_html(loop.index0, row) }}{% endfor %}
        <template data-repeat-template>{{ row_html('__n__', {}) }}</template>
      </div>
      {% if not step.scope %}
      <button type="button" class="btn btn--ghost btn--sm guide-add" data-repeat-add>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add another</button>
      {% endif %}
      {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
      <div class="guide-nav">
        <div class="guide-nav-side">
          <a class="btn btn--ghost" href="{{ url(back, scope) if back else url_for('guide.start', site=scope.id if scope else none) }}">Back</a>
          <a class="btn btn--ghost" href="{{ url(following, scope) }}">Skip</a>
        </div>
        {# The first button is what Enter does: Save and continue. #}
        <div class="guide-nav-side guide-nav-go">
          <button class="btn btn--primary" name="then" value="next">Save and continue</button>
          {% if not step.scope %}<button class="btn btn--ghost" name="then" value="more">Save and add more</button>{% endif %}
        </div>
      </div>
      <p class="hint">Rows left empty are skipped, and so is a step with none filled in.</p>
    </form>
    {% endif %}
  {% endif %}
  </div>
</div>
